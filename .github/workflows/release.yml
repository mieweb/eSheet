name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run nx release in dry-run mode only
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs['dry-run'] == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Nx base ref
        run: |
          echo "NX_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npx nx format:check --base="$NX_BASE"
      - run: npx nx run-many -t lint test build typecheck

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Nx release (dry-run)
        if: ${{ env.DRY_RUN == 'true' }}
        run: npx nx release --dry-run --yes

      - name: Nx release
        if: ${{ env.DRY_RUN == 'false' }}
        run: npx nx release --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
