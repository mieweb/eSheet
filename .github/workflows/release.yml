name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        default: dry-run
        type: choice
        options:
          - full-release
          - dry-run
      bump:
        description: 'Semver bump level'
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - prerelease

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force --unshallow || git fetch --tags --force

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Lint, test, typecheck
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-release'
        run: npx nx run-many -t lint test typecheck

      - name: Configure git identity
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-release'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Preview changelog (PR merge)
        if: github.event_name == 'pull_request'
        run: node release/release.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: node release/release.mjs --dry-run --bump=${{ inputs.bump }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Full release
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-release'
        run: node release/release.mjs --bump=${{ inputs.bump }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
