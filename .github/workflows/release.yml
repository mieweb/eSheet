name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run nx release in dry-run mode only
        required: false
        default: false
        type: boolean
      publish-only:
        description: Build and publish current package versions without bumping (use to recover a failed publish)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs['dry-run'] == true }}
      PUBLISH_ONLY: ${{ inputs['publish-only'] == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Nx base ref
        run: |
          echo "NX_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --legacy-peer-deps

      - run: npx nx format:check --base="$NX_BASE"
        if: ${{ env.PUBLISH_ONLY == 'false' }}
      - run: npx nx run-many -t lint test build typecheck
        if: ${{ env.PUBLISH_ONLY == 'false' }}

      - name: Build packages (publish-only mode)
        if: ${{ env.PUBLISH_ONLY == 'true' }}
        run: npx nx run-many -t build --projects=@esheet/core,@esheet/fields,@esheet/renderer,@esheet/builder,@esheet/renderer-blaze,@esheet/renderer-standalone

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Nx release (dry-run)
        if: ${{ env.DRY_RUN == 'true' && env.PUBLISH_ONLY == 'false' }}
        run: npx nx release --dry-run --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nx release
        if: ${{ env.DRY_RUN == 'false' && env.PUBLISH_ONLY == 'false' }}
        run: npx nx release --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish only (recover failed publish)
        if: ${{ env.PUBLISH_ONLY == 'true' }}
        run: npx nx release publish --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
