name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run nx release in dry-run mode only
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck

      - name: Nx release (dry-run)
        if: ${{ inputs['dry-run'] }}
        run: npx nx release --dry-run --yes

      - name: Nx release
        if: ${{ !inputs['dry-run'] }}
        run: npx nx release --yes