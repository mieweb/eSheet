name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        default: dry-run
        type: choice
        options:
          - full-release
          - dry-run
      bump:
        description: 'Semver bump level'
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - prerelease

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: quality gate — must pass before the bot is allowed to push.
  # Only runs for a real full-release dispatch; dry-run skips it.
  # ------------------------------------------------------------------
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Lint, test, typecheck
        run: npx nx run-many -t lint test typecheck

  # ------------------------------------------------------------------
  # Job 2: release — only runs after `check` succeeds (or is skipped
  # for dry-run / PR-merge paths).  The bot can NEVER push to main
  # unless this job runs, and it will not run if `check` failed.
  # ------------------------------------------------------------------
  release:
    needs: [check]
    # `check` is skipped for dry-run and PR-merge; treat skipped as success.
    # The bot can NEVER push to main unless this job runs, and it will not
    # run if `check` failed.
    if: >-
      always() && (
        needs.check.result == 'success' ||
        needs.check.result == 'skipped'
      ) && (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force --unshallow || git fetch --tags --force

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --legacy-peer-deps

      - name: Configure git identity
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-release'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Preview changelog (PR merge)
        if: github.event_name == 'pull_request'
        run: node release/release.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: node release/release.mjs --dry-run --bump=${{ inputs.bump }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Full release
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-release'
        run: node release/release.mjs --bump=${{ inputs.bump }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
