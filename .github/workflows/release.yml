name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run release in dry-run mode (no commits, no publish)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force --unshallow || git fetch --tags --force

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Lint, test, typecheck
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['dry-run'] == false }}
        run: npx nx run-many -t lint test typecheck

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Release (dry-run)
        if: ${{ inputs['dry-run'] == true }}
        run: node release/release.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['dry-run'] == false }}
        run: node release/release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
