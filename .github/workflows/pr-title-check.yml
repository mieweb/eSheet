name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            enhance
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            repo
          scopes: |
            repo
            docs
            demo
            core
            fields
            builder
            renderer
            renderer-standalone
            renderer-blaze
          requireScope: true
          subjectPattern: ^.+$
          subjectPatternError: |
            PR title must follow conventional commits format:
              feat(scope): description
              enhance(scope): description
              fix(scope): description
              perf(scope): description
              refactor(scope): description
              docs(scope): description
              chore(scope): description
              repo(scope): description

            Examples:
              repo(repo): update CI workflow
              chore(repo): update ci workflow
              docs(docs): add quickstart links
              enhance(renderer): improve empty state
              fix(renderer): handle empty schema
