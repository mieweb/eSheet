name: Atomic Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main
      confirm:
        description: Type deploy to confirm production deployment
        required: true

permissions:
  contents: read

concurrency:
  group: atomic-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      DEPLOY_PORT: '2046'

    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Manual deploy confirmation failed. Type 'deploy' to proceed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_REF }}

      - name: 'Guardrail: deploy refs from main history only'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Ref is not on origin/main history; refusing deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 'Preflight: install'
        run: npm ci

      - name: 'Preflight: build'
        run: npx nx run-many -t build -p docs,demo --outputStyle=static

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deploy host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote atomic deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
        run: |
          ssh -o BatchMode=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_REF='$DEPLOY_REF' DEPLOY_REPO_PATH='$DEPLOY_REPO_PATH' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_REPO_PATH"
          git fetch --prune origin
          git checkout --force "$DEPLOY_REF"

          command -v rsync >/dev/null 2>&1 || sudo apt-get install -y rsync

          npm ci
          bash deploy/scripts/workflow/atomic-deploy.sh
          EOF
